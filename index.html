<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Class Facts</title>
  <link rel="stylesheet" href="styles/style.css" />
</head>
<body>
  <h1>Class Facts</h1>

  <!-- JavaScript files -->

</html>
